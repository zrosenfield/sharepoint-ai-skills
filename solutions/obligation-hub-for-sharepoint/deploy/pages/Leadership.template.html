<title>Leadership &middot; Obligation Hub</title>
<style>
/* Obligation Hub - shared styles. Design language: 01 Atmospheric Precision.
   Depth and light organise the page. SharePoint's site navigation is the one primary nav, so the pages
   carry no nav bar of their own: just a quiet Obligation Hub mark above each page title.
   Every colour pair used for text is checked by tests/contrast.py. */
:root {
  /* palette */
  --graphite: #111827;
  --ice: #9AC7F5;
  --cloud: #EAF3FC;
  --white: #FFFFFF;
  --violet: #8B83DB;

  /* text */
  --ink: #111827;
  --ink-2: #374151;
  --ink-3: #4B5563;

  /* surfaces */
  --canvas: #F5F9FD;
  --surface: #FFFFFF;
  --surface-2: #F7FAFD;
  --track: #EAF3FC;
  --line: #E4EAF1;
  --line-2: #D3DDE9;
  --edge: #6B7A90;          /* control boundaries: >= 3:1 on white, cloud and track */

  /* data accents (fills, never small text) */
  --bar: #5A87C2;
  --bar-2: #7A71CF;
  --bar-track: #E8EFF7;

  /* functional tints: background / text / edge */
  --rose-bg: #FBEAEF;   --rose-ink: #8A1C3F;   --rose-edge: #C25A7C;
  --amber-bg: #FCF1D9;  --amber-ink: #6F4500;  --amber-edge: #B98424;
  --sage-bg: #E4F2EB;   --sage-ink: #1D5A42;   --sage-dot: #2F7A5C;
  --ice-bg: #E3EEFB;    --ice-ink: #1D3D66;
  --neutral-bg: #EEF2F6; --neutral-ink: #374151;
  --violet-bg: #ECEAFA; --violet-ink: #3F3891;

  /* type */
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 14px;
  --fs-base: 15px;
  --fs-lg: 17px;
  --fs-xl: 20px;
  --fs-2xl: 28px;
  --fs-hero: clamp(32px, 3.6vw, 48px);

  /* 8-point spacing */
  --s-half: 4px;
  --s1: 8px;
  --s2: 16px;
  --s3: 24px;
  --s4: 32px;
  --s5: 40px;
  --s6: 48px;
  --s8: 64px;
  --s12: 96px;

  --r-s: 8px;
  --r-m: 12px;
  --r-l: 16px;
  --r-xl: 24px;

  /* soft directional light from the upper left */
  --shadow-1: 0 1px 2px rgba(17, 24, 39, .04), 0 4px 12px -6px rgba(30, 41, 82, .10);
  --shadow-2: 0 1px 2px rgba(17, 24, 39, .05), 2px 14px 32px -18px rgba(30, 41, 82, .26);
  --shadow-3: 0 2px 4px rgba(17, 24, 39, .06), 4px 22px 44px -20px rgba(30, 41, 82, .34);

  --ease-spring: cubic-bezier(.2, 1.1, .3, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --container: 1280px;
  --gutter: 32px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  font-family: var(--font);
  font-size: var(--fs-base);
  line-height: 1.6;
  color: var(--ink);
  background: var(--canvas);
  font-feature-settings: "kern", "tnum" 0;
  -webkit-font-smoothing: antialiased;
}
/* Abstract light behind the top of every page. Purely decorative. */
body::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 760px;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(60% 80% at 10% -4%, rgba(154, 199, 245, .42), rgba(154, 199, 245, 0) 70%),
    radial-gradient(46% 64% at 90% 4%, rgba(139, 131, 219, .20), rgba(139, 131, 219, 0) 72%),
    linear-gradient(180deg, #EEF5FD 0%, rgba(245, 249, 253, 0) 100%);
}

h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 600; color: var(--ink); letter-spacing: -.01em; }
h1 { font-size: var(--fs-2xl); line-height: 1.25; letter-spacing: -.02em; }
h2 { font-size: var(--fs-xl); line-height: 1.4; }
h3 { font-size: var(--fs-lg); line-height: 1.4; }
h4 { font-size: var(--fs-base); line-height: 1.5; }
p { margin: 0; }
a { color: inherit; text-decoration-color: var(--violet); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--ink); }
strong { font-weight: 600; }
code, pre { font-family: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, monospace; }
img, svg { max-width: 100%; }
.tl-svg, .mini svg { max-width: none; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.tnum { font-variant-numeric: tabular-nums; }

:focus { outline: none; }
:focus-visible { outline: 2px solid var(--graphite); outline-offset: 2px; }

.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- layout ---------- */
.wrap { width: min(var(--container), calc(100% - 2 * var(--gutter))); margin-inline: auto; }
/* Top space under SharePoint's header: 40 / 32 / 24 px on the 8-pt rhythm (desktop / tablet / phone). */
main { display: block; padding-block: var(--s5) var(--s8); }
.stack > * + * { margin-top: var(--s3); }
.section { margin-top: var(--s6); }
.grid-main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--s3); align-items: start; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.side { display: grid; gap: var(--s3); }

/* ---------- page header ---------- */
.page-head { display: grid; gap: var(--s2); max-width: 820px; }
.eyebrow { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.lede { font-size: var(--fs-lg); line-height: 1.6; color: var(--ink-2); max-width: 64ch; }
.meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); color: var(--ink-3); font-size: var(--fs-md); }
/* the only identity on the page: plain text, no links (SharePoint's nav does the navigating) */
.hub-mark { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.hub-mark svg { width: 16px; height: 16px; flex: none; }
.hub-mark::after { content: ""; width: 1px; height: 12px; margin-left: 8px; background: var(--line-2); }

/* data-source badge */
.badge {
  display: inline-flex; align-items: center; gap: 8px; min-height: 28px; padding: 2px 12px 2px 10px;
  border-radius: 999px; border: 1px solid var(--line-2); background: var(--white);
  color: var(--ink-2); font-size: var(--fs-sm); font-weight: 600; white-space: nowrap;
}
.badge__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); flex: none; }
.badge--live .badge__dot { background: var(--sage-dot); box-shadow: 0 0 0 3px rgba(47, 122, 92, .16); }
.badge--sample .badge__dot { background: transparent; border: 2px solid var(--violet); }
.badge--loading .badge__dot { animation: pulse 1.2s ease-in-out infinite; }
.data-note { font-size: var(--fs-md); color: var(--ink-2); }

/* ---------- cards ---------- */
.card {
  position: relative;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l);
  box-shadow: var(--shadow-1); padding: var(--s3);
}
.card--flush { padding: 0; overflow: hidden; }
.card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s2); margin-bottom: var(--s2); }
.card__head p { color: var(--ink-3); font-size: var(--fs-md); margin-top: 2px; }
.card__foot { margin-top: var(--s2); padding-top: var(--s2); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: center; }
.card--tint { background: linear-gradient(160deg, rgba(234, 243, 252, .9), rgba(255, 255, 255, .96) 60%); }
a.card, .card--link { display: block; color: inherit; text-decoration: none; transition: transform .45s var(--ease-spring), box-shadow .45s var(--ease-spring), border-color .2s ease; }
a.card:hover, .card--link:hover { transform: translateY(-2px); box-shadow: var(--shadow-3); border-color: var(--line-2); }
a.card:active { transform: translateY(0); box-shadow: var(--shadow-1); }
.pad { padding: var(--s3) var(--s3) 0; }
.card__head.pad { padding-bottom: 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s2); margin-bottom: var(--s2); flex-wrap: wrap; }
.section-head p { color: var(--ink-3); font-size: var(--fs-md); }

/* ---------- pills ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 2px 10px;
  border-radius: 999px; border: 1px solid transparent;
  background: var(--neutral-bg); color: var(--neutral-ink);
  font-size: var(--fs-xs); font-weight: 600; line-height: 1.3; white-space: nowrap; vertical-align: middle;
}
.pill svg { width: 10px; height: 10px; flex: none; fill: currentColor; }
.pill--overdue { background: var(--rose-bg); color: var(--rose-ink); }
.pill--soon { background: var(--amber-bg); color: var(--amber-ink); }
.pill--upcoming { background: var(--ice-bg); color: var(--ice-ink); }
.pill--nodate { background: var(--neutral-bg); color: var(--neutral-ink); }
.pill--closed, .pill--ok { background: var(--sage-bg); color: var(--sage-ink); }
.pill--review { background: var(--violet-bg); color: var(--violet-ink); }
.pill--quiet { background: var(--white); color: var(--ink-2); border-color: var(--line-2); }
.pill--empty { background: var(--white); color: var(--ink-2); border: 1px dashed var(--edge); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ---------- buttons & links ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 18px; border-radius: 999px;
  border: 1px solid var(--edge); background: var(--white); color: var(--ink);
  font-size: var(--fs-md); font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap;
  transition: transform .4s var(--ease-spring), box-shadow .4s var(--ease-spring), background-color .2s ease;
}
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); }
.btn:active { transform: translateY(0); box-shadow: none; }
.btn--primary { background: var(--graphite); color: var(--white); border-color: var(--graphite); }
.btn--primary:hover { background: #1F2937; }
.btn--quiet { border-color: transparent; background: transparent; padding: 0 10px; }
.btn--quiet:hover { background: var(--track); box-shadow: none; }
.btn--sm { min-height: 32px; padding: 0 12px; font-size: var(--fs-sm); }
.btn-row { display: flex; flex-wrap: wrap; gap: var(--s1); align-items: center; }
.link-arrow { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 600; font-size: var(--fs-md); color: var(--ink); text-decoration: underline; text-decoration-color: var(--violet); }
.link-arrow svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; transition: transform .4s var(--ease-spring); }
.link-arrow:hover svg { transform: translateX(3px); }

/* tooltip-style hints that also work for keyboard users */
.hint { position: relative; display: inline-flex; }
.hint__text {
  position: absolute; left: 50%; bottom: calc(100% + 10px); z-index: 30; width: max-content; max-width: 260px;
  padding: 10px 12px; border-radius: var(--r-m); background: var(--graphite); color: var(--white);
  font-size: var(--fs-sm); font-weight: 400; line-height: 1.5; text-align: left; box-shadow: var(--shadow-3);
  opacity: 0; transform: translate(-50%, 4px); pointer-events: none;
  transition: opacity .2s ease, transform .35s var(--ease-spring);
}
.hint__text::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 12px; }
.hint:hover .hint__text, .hint:focus-within .hint__text { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.hint.is-dismissed .hint__text { opacity: 0; pointer-events: none; }

/* ---------- form controls ---------- */
.field { display: grid; gap: 6px; }
.field label, .label { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); }
.control {
  min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--edge);
  background: var(--white); color: var(--ink); min-width: 0;
}
select.control { padding-right: 32px; }
.control::placeholder { color: var(--ink-3); opacity: 1; }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: flex-end; }

/* quiet segmented control */
.seg { display: inline-flex; gap: 2px; padding: 4px; border-radius: 14px; background: var(--track); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg__opt {
  display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 16px; border-radius: 10px;
  border: 1px solid transparent; color: var(--ink-2); text-decoration: none; font-size: var(--fs-md); white-space: nowrap;
  transition: background-color .35s var(--ease-spring), box-shadow .35s var(--ease-spring);
}
.seg__opt:hover { background: rgba(255, 255, 255, .8); color: var(--ink); }
.seg__opt[aria-current="true"] { background: var(--white); color: var(--ink); font-weight: 600; border-color: var(--edge); box-shadow: var(--shadow-1); }
.seg__n { font-variant-numeric: tabular-nums; color: var(--ink-3); font-weight: 600; }

/* ---------- tables: never glass; fine dividers ---------- */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
.table caption { text-align: left; }
.table th {
  text-align: left; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); padding: 12px; border-bottom: 1px solid var(--line-2); white-space: nowrap; background: var(--surface);
}
.table td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table th:first-child, .table td:first-child { padding-left: var(--s3); }
.table th:last-child, .table td:last-child { padding-right: var(--s3); }
.nowrap { white-space: nowrap; }
.table tbody tr { transition: background-color .2s ease; }
.table tbody tr:hover { background: var(--surface-2); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.cell-title { font-weight: 600; color: var(--ink); }
a.cell-title { text-decoration-thickness: 1px; text-decoration-color: rgba(91, 84, 173, .55); }
a.cell-title:hover { text-decoration-color: var(--ink); text-decoration-thickness: 1.5px; }
.cell-sub { display: block; font-size: var(--fs-sm); color: var(--ink-3); margin-top: 2px; }
.muted { color: var(--ink-3); }
.timing-note { max-width: 18ch; }

/* ---------- lists ---------- */
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { padding: 14px 0; border-top: 1px solid var(--line); }
.rows > li:first-child { border-top: 0; padding-top: 0; }
.rows > li:last-child { padding-bottom: 0; }

/* ---------- states ---------- */
.state { display: grid; justify-items: center; text-align: center; gap: var(--s1); padding: var(--s6) var(--s3); color: var(--ink-2); }
.state h2, .state h3 { font-size: var(--fs-lg); }
.state p { max-width: 46ch; color: var(--ink-2); }
.state svg { width: 120px; height: 96px; margin-bottom: var(--s1); }
.state--inline { justify-items: start; text-align: left; padding: var(--s2) 0; }
.state--error { border: 1px solid var(--rose-edge); background: var(--rose-bg); color: var(--rose-ink); border-radius: var(--r-l); justify-items: start; text-align: left; padding: var(--s3); }
.state--error h2, .state--error p { color: var(--rose-ink); }
.notice {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r-m);
  background: var(--amber-bg); color: var(--amber-ink); font-size: var(--fs-md); border: 1px solid rgba(185, 132, 36, .35);
}
.notice svg { width: 18px; height: 18px; flex: none; margin-top: 2px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.notice--rose { background: var(--rose-bg); color: var(--rose-ink); border-color: rgba(194, 90, 124, .35); }
.notice--info { background: var(--ice-bg); color: var(--ice-ink); border-color: rgba(90, 135, 194, .3); }
.notice a { color: inherit; }

.skel { display: block; height: 14px; border-radius: 8px; background: linear-gradient(90deg, #EAF0F7 0%, #F6F9FC 40%, #EAF0F7 80%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }
.skel + .skel { margin-top: 12px; }
.skel--title { height: 28px; width: 60%; }
.skel--block { height: 120px; border-radius: var(--r-l); }
.skel--w80 { width: 80%; } .skel--w60 { width: 60%; } .skel--w40 { width: 40%; }

/* ---------- details / disclosure ---------- */
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.disclose > summary {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; border-radius: var(--r-s);
  font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2);
}
.disclose > summary svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; transition: transform .35s var(--ease-spring); }
.disclose[open] > summary svg { transform: rotate(90deg); }
.quote {
  margin: var(--s1) 0 0; padding: 12px 16px; border-left: 2px solid var(--violet);
  background: var(--surface-2); border-radius: 0 var(--r-m) var(--r-m) 0; color: var(--ink-2); font-size: var(--fs-md);
}

/* copy chips */
.chip {
  display: inline-flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 16px; border-radius: 999px;
  border: 1px solid var(--edge); background: var(--white); color: var(--ink); text-align: left; cursor: pointer;
  font-size: var(--fs-md); line-height: 1.4;
  transition: transform .4s var(--ease-spring), box-shadow .4s var(--ease-spring);
}
.chip svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.chip:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); }
.chip__state { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); }
.copy-manual { flex-basis: 100%; display: grid; gap: 6px; max-width: 560px; }
.copy-manual .control { width: 100%; }

/* footer */
.foot { padding: var(--s4) 0 var(--s6); color: var(--ink-3); font-size: var(--fs-sm); border-top: 1px solid var(--line); }
.foot .wrap { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); justify-content: space-between; }

/* ---------- motion: soft reveal that communicates order ---------- */
/* Static sections fade up once on load. Content drawn later by script only settles into place (no opacity),
   so it can never be left invisible if an animation is throttled. */
.reveal { animation: rise .7s var(--ease-out) both; animation-delay: calc(var(--d, 0) * 70ms); }
.settle { animation: settle .6s var(--ease-spring) backwards; animation-delay: calc(var(--d, 0) * 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes settle { from { transform: translateY(8px); } to { transform: none; } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  a.card:hover, .btn:hover, .chip:hover { transform: none; }
}
@media (forced-colors: active) {
  .pill, .badge, .seg__opt[aria-current="true"] { border: 1px solid CanvasText; }
  .seg__opt[aria-current="true"] { outline: 2px solid Highlight; }
}
@media print {
  body::before { display: none; }
  .card { box-shadow: none; break-inside: avoid; }
}
@media (pointer: coarse) {
  .btn, .chip, .control, .seg__opt { min-height: 44px; }
}

/* ---------- responsive: tablet ---------- */
@media (max-width: 1080px) {
  :root { --gutter: 24px; }
  main { padding-top: var(--s4); }
  .grid-main { grid-template-columns: minmax(0, 1fr); }
  .side { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* dense tables become stacked cards below tablet-landscape */
@media (max-width: 860px) {
  .table--stack thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .table--stack, .table--stack tbody, .table--stack td { display: block; width: 100%; }
  .table--stack colgroup { display: none; }
  .table--stack tr { display: flex; flex-direction: column; gap: 4px; padding: 16px var(--s3); border-bottom: 1px solid var(--line); }
  .table--stack tr:last-child { border-bottom: 0; }
  .table--stack td, .table--stack td:first-child, .table--stack td:last-child { padding: 0; border: 0; }
  .table--stack td.cell-lead { order: -1; padding-bottom: 4px; font-size: var(--fs-base); }
  .table--stack td[data-label] { display: grid; grid-template-columns: 128px minmax(0, 1fr); align-items: baseline; gap: 12px; }
  .table--stack td[data-label]::before { content: attr(data-label); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
  .table--stack td[data-label] > * { justify-self: start; }
  .table--stack .due-date strong, .table--stack .due-date .cell-sub { display: inline; margin: 0; }
  .table--stack .due-date .cell-sub::before { content: " \00b7 "; }
}

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3); }

.split { display: block; width: 100%; height: 16px; margin-top: var(--s2); }
.legend { list-style: none; margin: var(--s2) 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); font-size: var(--fs-md); color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 8px; }
.legend svg { width: 12px; height: 12px; flex: none; }
.legend strong { color: var(--ink); font-variant-numeric: tabular-nums; }

/* bar charts rendered as tables: the table is the accessible equivalent, the inline SVG draws the bar */
.bars { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
.bars caption { text-align: left; font-size: var(--fs-sm); color: var(--ink-3); padding-bottom: var(--s1); }
.bars th, .bars td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.bars tr:last-child th, .bars tr:last-child td { border-bottom: 0; }
.bars thead th { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); text-align: left; padding-top: 0; }
.bars tbody th { text-align: left; font-weight: 400; color: var(--ink); padding-right: var(--s2); width: 38%; }
.bars .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; width: 48px; padding-right: 12px; }
.bars .bar svg { display: block; width: 100%; height: 14px; }
.bars .sub { display: block; font-size: var(--fs-xs); color: var(--ink-3); font-weight: 400; }

.months { width: 100%; border-collapse: collapse; table-layout: fixed; }
.months thead { display: table-footer-group; }
.months caption { text-align: left; font-size: var(--fs-sm); color: var(--ink-3); padding-bottom: var(--s2); }
.months td { vertical-align: bottom; text-align: center; padding: 0 6px; }
.months td svg { display: block; width: 100%; max-width: 56px; height: 120px; margin: 0 auto; }
.months td span { display: block; font-weight: 600; font-variant-numeric: tabular-nums; margin-bottom: 6px; }
.months th { padding-top: 10px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); border-top: 1px solid var(--line-2); }
.months th small { display: block; font-weight: 400; color: var(--ink-3); font-size: var(--fs-xs); }

.owe { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); margin-top: var(--s2); }
.owe div { padding: var(--s2); border-radius: var(--r-m); background: var(--surface-2); border: 1px solid var(--line); }
.owe strong { display: block; font-size: 28px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.owe span { font-size: var(--fs-sm); color: var(--ink-2); }
.nohist { display: flex; gap: 12px; align-items: flex-start; font-size: var(--fs-md); color: var(--ink-2); }
.nohist svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }

.risk-key h2 { font-size: var(--fs-lg); }
.risk-key__list { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: var(--s2) var(--s4); margin: var(--s2) 0 0; }
.risk-key__list > div { min-width: 0; padding-top: 12px; border-top: 1px solid var(--line-2); }
.risk-key__list dt { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink); }
.risk-key__list dt svg { width: 12px; height: 12px; flex: none; }
.risk-key__list dd { margin: 4px 0 0; font-size: var(--fs-md); color: var(--ink-2); }
.risk-key__note { margin-top: var(--s2); font-size: var(--fs-sm); color: var(--ink-3); }

@media (max-width: 1080px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .risk-key__list { grid-template-columns: minmax(0, 1fr); gap: var(--s1); } }
@media (max-width: 640px) {
  .stats { gap: var(--s2); }
  .stat__value { font-size: 32px; }
  .bars tbody th { width: 46%; }
  .owe { grid-template-columns: minmax(0, 1fr); }
  .owe div { display: flex; align-items: baseline; gap: 12px; }
}

nsurance","Recurring","Annual","2027-01-15","","Avery Chen","Avery Chen","Facilities","Not started","Upcoming","Confirmed","High","Medium","07-Alpine-Ski-House-Office-Lease.docx|Section 5.1|deliver-coi","","Yes"],["40","Exercise Alpine Ski House lease renewal option by December 30, 2026","07-Alpine-Ski-House-Office-Lease.docx","Alpine Ski House","If not in default, Northwind may extend the lease once for 5 years at 95% of prevailing Bellevue market rent by written notice delivered between September 30 and December 30, 2026 (12 to 9 months before the September 30, 2027 Expiration Date); otherwise the option lapses. Through September 30, 2027.","Section 6.2","Tenant may exercise the renewal option only by delivering written notice to Landlord no earlier than twelve (12) months and no later than nine (9) months before the Expiration Date. If Tenant does not deliver notice within that period, the renewal option lapses and is of no further force or effect.","Us","Notice \u0026 renewal","Fixed date","None","2026-12-30","","Avery Chen","Avery Chen","Facilities","Not started","Upcoming","Confirmed","Medium","High","07-Alpine-Ski-House-Office-Lease.docx|Section 6.2|exercise-renewal-option","Window opens 2026-09-30; notice before then is invalid.","Yes"],["41","Send Wide World Importers 6-month forecast by the 5th","08-Wide-World-Importers-Supply-Agreement.docx","Wide World Importers","On or before the 5th of each month, Northwind must give Wide World Importers a rolling 6-month non-binding forecast of its anticipated requirements for each Product. Through May 31, 2028.","Section 2.2","On or before the fifth (5th) day of each calendar month, Buyer shall provide Supplier with a rolling six (6) month non-binding forecast of its anticipated requirements for each Product.","Us","Purchasing \u0026 volume","Recurring","Monthly","2026-12-05","","Avery Chen","Avery Chen","Procurement","Not started","Due soon","Confirmed","High","Medium","08-Wide-World-Importers-Supply-Agreement.docx|Section 2.2|send-forecast","","Yes"],["42","Wide World Importers: give 90 days' notice before discontinuing","08-Wide-World-Importers-Supply-Agreement.docx","Wide World Importers","Wide World Importers must give Northwind at least 90 days' prior written notice before discontinuing any Product and accept last-time-buy purchase orders for it submitted during that notice period. Through May 31, 2028.","Section 2.5","Supplier shall give Buyer at least ninety (90) days' prior written notice before discontinuing any Product, and shall accept last-time-buy Purchase Orders for the discontinued Product submitted during that notice period.","Counterparty","Purchasing \u0026 volume","Event-driven","None","","Wide World Importers plans to discontinue a Product","Avery Chen","Avery Chen","Procurement","Not started","No date","Confirmed","High","Low","08-Wide-World-Importers-Supply-Agreement.docx|Section 2.5|give-discontinuation-notice","","Yes"],["43","Hold annual price review with Wide World Importers by October 31","08-Wide-World-Importers-Supply-Agreement.docx","Wide World Importers","Each year the parties must meet no later than October 31 to review Product pricing for the next calendar year; agreed changes take effect January 1 once documented in an updated Exhibit A signed by both. Through May 31, 2028.","Section 3.2","Each year during the Term, the Parties shall meet no later than October 31 to review Product pricing for the following calendar year. Agreed price changes take effect on January 1 of the following year once documented in an updated Exhibit A signed by both Parties.","Both","Purchasing \u0026 volume","Recurring","Annual","2027-10-31","","Avery Chen","Avery Chen","Procurement","Not started","Upcoming","Confirmed","High","Medium","08-Wide-World-Importers-Supply-Agreement.docx|Section 3.2|hold-price-review","","Yes"],["44","Pay Wide World Importers invoices within 45 days of receipt","08-Wide-World-Importers-Supply-Agreement.docx","Wide World Importers","Northwind must pay each undisputed shipment invoice, issued on delivery, within 45 days after receiving it. Through May 31, 2028.","Section 3.3","Supplier will invoice each shipment upon delivery. Buyer shall pay each undisputed invoice within forty-five (45) days after receipt of the invoice.","Us","Payment","Event-driven","None","","Receipt of each shipment invoice","Avery Chen","Avery Chen","Procurement","Not started","No date","Confirmed","High","Medium","08-Wide-World-Importers-Supply-Agreement.docx|Section 3.3|pay-invoices","","Yes"],["45","Notify Wide World Importers of defects within 14 days of delivery","08-Wide-World-Importers-Supply-Agreement.docx","Wide World Importers","Northwind must notify Wide World Importers in writing of any Defect within 14 days after delivery of the affected Products, or they are deemed accepted (except latent Defects); the remedy is replacement or credit at Northwind's option. Through May 31, 2028.","Section 4.1","Buyer shall notify Supplier in writing of any Defect within fourteen (14) days after delivery of the affected Products. Products for which Buyer gives no notice of Defect within that period are deemed accepted, except for latent Defects that could not reasonably have been discovered on inspection.","Us","Other","Event-driven","None","","Each delivery of Products","Avery Chen","Avery Chen","Procurement","Not started","No date","Confirmed","High","Medium","08-Wide-World-Importers-Supply-Agreement.docx|Section 4.1|notify-defects","","Yes"],["46","Pay Adventure Works Cycles quarterly rebate within 45 days","09-Adventure-Works-Reseller-Agreement.docx","Adventure Works Cycles","For each calendar quarter in which Net Purchases exceed $150,000, Northwind must pay Adventure Works Cycles a 3% rebate with a calculation statement within 45 days after quarter end; rebates for quarters ending by expiry stay payable after it. Through December 31, 2026.","Section 3.2","Reseller shall pay each rebate earned under Section 3.1, together with a rmed","High","Medium","09-Adventure-Works-Reseller-Agreement.docx|Section 4.2|notify-better-pricing","","Yes"],["49","Decide on Adventure Works Cycles renewal before December 31, 2026 expiry","09-Adventure-Works-Reseller-Agreement.docx","Adventure Works Cycles","The agreement expires on December 31, 2026 and does not renew automatically; any renewal or extension requires a written agreement signed by both parties. Through December 31, 2026.","Section 5.1","This Agreement begins on January 1, 2024 and expires on December 31, 2026. This Agreement does not renew automatically, and any renewal or extension requires a written agreement signed by both Parties.","Both","Notice \u0026 renewal","Fixed date","None","2026-12-31","","Avery Chen","Avery Chen","Sales","Not started","Upcoming","Confirmed","High","High","09-Adventure-Works-Reseller-Agreement.docx|Section 5.1|decide-renewal","","Yes"],["50","Fourth Coffee: deliver food-safety inspection certificate by March 1","10-Fourth-Coffee-Facilities-Services-Agreement.docx","Fourth Coffee","Fourth Coffee must deliver Northwind a copy of its annual food-safety inspection certificate, issued by an accredited third-party inspector, by March 1 each year.","Section 3.2","Supplier shall deliver to Customer a copy of its annual food-safety inspection certificate, issued by an accredited third-party inspector, by March 1 of each year.","Counterparty","Compliance \u0026 audit","Recurring","Annual","2027-03-01","","Avery Chen","Avery Chen","Facilities","Not started","Upcoming","Confirmed","High","Low","10-Fourth-Coffee-Facilities-Services-Agreement.docx|Section 3.2|deliver-inspection-certificate","","Yes"],["51","Give Fourth Coffee 60 days' notice to terminate for convenience","10-Fourth-Coffee-Facilities-Services-Agreement.docx","Fourth Coffee","Either party may end the agreement for convenience by giving the other at least 60 days' prior written notice.","Section 4.2","Either Party may terminate this Agreement for convenience by giving the other Party at least sixty (60) days' prior written notice.","Both","Notice \u0026 renewal","Event-driven","None","","Either party decides to terminate for convenience","Avery Chen","Avery Chen","Facilities","Not started","No date","Confirmed","High","Medium","10-Fourth-Coffee-Facilities-Services-Agreement.docx|Section 4.2|give-termination-notice","","Yes"],["52","Pay Woodgrove Bank monthly interest on the 1st","11-Woodgrove-Bank-Revolving-Credit-Facility.docx","Woodgrove Bank","Northwind must pay accrued interest on outstanding Advances (one-month Term SOFR plus 2.25%, actual/360) monthly in arrears on the 1st of each month; non-payment within 3 Business Days after the due date is an Event of Default. Through September 15, 2029.","Section 2.2","The Borrower shall pay accrued interest on all outstanding Advances monthly in arrears on the first (1st) day of each calendar month.","Us","Payment","Recurring","Monthly","2026-12-01","","Avery Chen","Avery Chen","Finance","Not started","Due soon","Confirmed","High","Medium","11-Woodgrove-Bank-Revolving-Credit-Facility.docx|Section 2.2|pay-interest","","Yes"],["53","Repay Woodgrove Bank advances at September 15, 2029 maturity","11-Woodgrove-Bank-Revolving-Credit-Facility.docx","Woodgrove Bank","Northwind must repay all outstanding Advances, with accrued and unpaid interest, on the Maturity Date of September 15, 2029. Through September 15, 2029.","Section 2.3","The Borrower shall repay all outstanding Advances, together with accrued and unpaid interest, on the Maturity Date.","Us","Payment","Fixed date","None","2029-09-15","","Avery Chen","Avery Chen","Finance","Not started","Upcoming","Confirmed","High","Medium","11-Woodgrove-Bank-Revolving-Credit-Facility.docx|Section 2.3|repay-advances","","Yes"],["54","Deliver Woodgrove Bank quarterly compliance certificate (45 days)","11-Woodgrove-Bank-Revolving-Credit-Facility.docx","Woodgrove Bank","Within 45 days after each fiscal quarter end, starting with the quarter ending December 31, 2026, Northwind must deliver Woodgrove Bank a CFO-signed compliance certificate with unaudited consolidated quarterly financial statements showing compliance with the minimum Liquidity covenant. Through September 15, 2029.","Section 3.1","Within forty-five (45) days after the end of each fiscal quarter of the Borrower, commencing with the fiscal quarter ending December 31, 2026, the Borrower shall deliver to the Bank a compliance certificate signed by its chief financial officer, together with unaudited consolidated financial statements for that quarter, demonstrating compliance with Section 4.1.","Us","Reporting","Recurring","Quarterly","2027-02-14","","Avery Chen","Avery Chen","Finance","Not started","Upcoming","Confirmed","Medium","High","11-Woodgrove-Bank-Revolving-Credit-Facility.docx|Section 3.1|deliver-compliance-certificate","","Yes"],["55","Deliver audited financial statements to Woodgrove Bank (120 days)","11-Woodgrove-Bank-Revolving-Credit-Facility.docx","Woodgrove Bank","Within 120 days after each June 30 fiscal year end, starting with fiscal 2027 (due October 28, 2027), Northwind must deliver Woodgrove Bank audited consolidated financial statements with an unqualified opinion from an independent CPA firm. Through September 15, 2029.","Section 3.2","Within one hundred twenty (120) days after the end of each fiscal year of the Borrower, which ends on June 30, commencing with the fiscal year ending June 30, 2027, the Borrower shall deliver to the Bank audited consolidated financial statements reported on without qualification by an independent certified public accounting firm.","Us","Reporting","Recurring","Annual","2027-10-28","","Avery Chen","Avery Chen","Finance","Not started","Upcoming","Confirmed","Medium","High","11-Woodgrove-Bank-Revolving-Credit-Facility.docx|Section 3.2|deliver-audited-financials","","Yes"],["56","Notify Woodgrove Bank of any default within 5 business days","11-Woodgrove-Bank-Revolving-Credit-Facility.docx","Woodgrove Bank","Northwind must notify Woodgrove Bank in writing within 5 Business Days after any officer becomes aware of any Default or Event of Default, describing it and the action Northwind proposes to take. Through September 15, 2029.","Section 3.3","The Borrower shall notify the Bank in writing within five (5) Business Days after any officer of the Borrower becomes aware of any Default or Event of Default, describing it and the action the Borrower proposes to take.","Us","Compliance \u0026 audit","Event-driven","None","","An officer becomes aware of a Default or Event of Default","Avery Chen","Avery Chen","Finance","Not started","No date","Confirmed","High","High","11-Woodgrove-Bank-Revolving-Credit-Facility.docx|Section 3.3|notify-default","","Yes"],["57","Maintain $5,000,000 minimum liquidity with Woodgrove Bank","11-Woodgrove-Bank-Revolving-Credit-Facility.docx","Woodgrove Bank","Northwind must keep at least $5,000,000 of unrestricted cash and cash equivalents in deposit accounts with Woodgrove Bank at all times, tested at each fiscal quarter end and reported in each compliance certificate; a breach is an Event of Default. Through September 15, 2029.","Section 4.1","The Borrower shall maintain Liquidity of not less than $5,000,000 at all times. Compliance will be tested on the last day of each fiscal quarter and reported in each compliance certificate.","Us","Compliance \u0026 audit","Ongoing","None","","","Avery Chen","Avery Chen","Finance","Not started","No date","Confirmed","High","High","11-Woodgrove-Bank-Revolving-Credit-Facility.docx|Section 4.1|maintain-minimum-liquidity","","Yes"],["58","Deliver insurance endorsements to Woodgrove Bank (60 days)","11-Woodgrove-Bank-Revolving-Credit-Facility.docx","Woodgrove Bank","Within 60 days after the September 15, 2026 Closing Date (by November 14, 2026), Northwind must deliver Woodgrove Bank lender's loss payable and additional insured endorsements, satisfactory to the Bank, under its property and general liability policies; failure continuing 15 days after Bank notice is an Event of Default. Through September 15, 2029.","Section 5.1","Within sixty (60) days after the Closing Date, the Borrower shall deliver to the Bank lender's loss payable and additional insured endorsements, in form satisfactory to the Bank, under the Borrower's property and general liability insurance policies.","Us","Insurance","Fixed date","None","2026-11-14","","Avery Chen","Avery Chen","Finance","Not started","Overdue","Confirmed","Medium","Medium","11-Woodgrove-Bank-Revolving-Credit-Facility.docx|Section 5.1|deliver-insurance-endorsements","","Yes"],["59","Pay Tailspin per dealer credit application terms","04-Tailspin-Distribution-Agreement.docx","Tailspin Toys","Pay for each purchase order on the payment terms in the dealer credit application approved by Tailspin; that document isn't in the Contracts library.","Section 3.3","Payment terms are those set out in the dealer credit application approved by Supplier for Distributor.","Us","Payment","Event-driven","None","","Northwind places a purchase order with Tailspin (payment terms in the dealer credit application)","","","Sales","Not started","No date","Needs review","Low","Medium","04-Tailspin-Distribution-Agreement.docx|Section 3.3|terms-in-missing-document","Held: the operative terms are in a document that isn't in the Contracts library. Add it or confirm the terms.","Yes"],["60","Adventure Works: pay per standard credit terms","09-Adventure-Works-Reseller-Agreement.docx","Adventure Works Cycles","Adventure Works pays for its purchase orders on Northwind's standard credit terms approved for it; those terms aren't in the Contracts library.","Section 2.2","Payment terms are set out in Reseller's standard credit terms approved for Customer.","Counterparty","Payment","Event-driven","None","","Adventure Works places a purchase order (payment terms in Northwind's standard credit terms)","","","Sales","Not started","No date","Needs review","Low","Medium","09- <script>
/* Obligation Hub - shared data layer and UI helpers (plain JS, no network). */
(function (window, document) {
  'use strict';
  var Hub = window.Hub = {};
  var DAY = 86400000;
  var LIVE_WAIT_MS = 800;     // how long to wait for the host to inject live results
  var LATE_WATCH_MS = 8000;   // keep watching for a late injection, then stop

  /* ---------------- small utilities ---------------- */
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }
  function clean(v) {
    if (v == null) return '';
    if (typeof v === 'object') {
      if (Array.isArray(v)) return v.map(clean).filter(Boolean).join(', ');
      return clean(v.title || v.Title || v.displayName || v.DisplayName || v.name || v.Name ||
        v.LookupValue || v.lookupValue || v.Label || v.label || v.text || v.value || v.Value || '');
    }
    var s = String(v).replace(/\s+/g, ' ').trim();
    return /^(null|undefined|none;#)$/i.test(s) ? '' : s;
  }
  function lower(v) { return clean(v).toLowerCase(); }
  function readJSONScript(id) {
    var el = document.getElementById(id);
    if (!el) return null;
    try { return JSON.parse(el.textContent); } catch (e) { return null; }
  }
  function byId(id) { return document.getElementById(id); }
  function setHTML(id, html) { var el = typeof id === 'string' ? byId(id) : id; if (el) el.innerHTML = html; return el; }
  function closest(el, sel) {
    while (el && el.nodeType === 1) {
      if (el.matches ? el.matches(sel) : false) return el;
      el = el.parentNode;
    }
    return null;
  }
  function uniq(list) { var seen = {}, out = []; list.forEach(function (x) { var k = String(x).toLowerCase(); if (x && !seen[k]) { seen[k] = 1; out.push(x); } }); return out; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function truncate(s, n) { s = clean(s); return s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '\u2026' : s; }
  Hub.esc = esc; Hub.clean = clean; Hub.byId = byId; Hub.setHTML = setHTML; Hub.closest = closest;
  Hub.uniq = uniq; Hub.plural = plural; Hub.truncate = truncate; Hub.readJSONScript = readJSONScript;

  /* ---------------- configuration & URLs ---------------- */
  var cfg = readJSONScript('hub-config') || {};
  cfg.lists = cfg.lists || {};
  function unreplaced(v) { return typeof v !== 'string' || v.indexOf('{{') !== -1; }
  Hub.cfg = cfg;
  Hub.preview = unreplaced(cfg.siteUrl);
  function listInfo(key) { return cfg.lists[key] || {}; }
  function listRoot(key) { return (cfg.origin || '') + (listInfo(key).url || ''); }
  function viewBase(key) { return listRoot(key) + (listInfo(key).library ? '/Forms/AllItems.aspx' : '/AllItems.aspx'); }
  Hub.url = {
    root: listRoot,
    view: function (key, filters) {
      var q = [];
      (filters || []).forEach(function (f, i) {
        var n = i + 1;
        if (Array.isArray(f[1])) q.push('FilterFields' + n + '=' + encodeURIComponent(f[0]) + '&FilterValues' + n + '=' + encodeURIComponent(f[1].join(';#')));
        else q.push('FilterField' + n + '=' + encodeURIComponent(f[0]) + '&FilterValue' + n + '=' + encodeURIComponent(f[1]));
      });
      return viewBase(key) + (q.length ? '?' + q.join('&') : '');
    },
    disp: function (key, id) { return id ? listRoot(key) + (listInfo(key).library ? '/Forms/DispForm.aspx' : '/DispForm.aspx') + '?ID=' + encodeURIComponent(id) : viewBase(key); },
    edit: function (key, id, back) {
      if (!id) return viewBase(key);
      var u = listRoot(key) + (listInfo(key).library ? '/Forms/EditForm.aspx' : '/EditForm.aspx') + '?ID=' + encodeURIComponent(id);
      if (back && !Hub.preview) u += '&Source=' + encodeURIComponent(Hub.url.page(back));
      return u;
    },
    file: function (key, name) { return listRoot(key) + '/' + encodeURIComponent(name).replace(/%2F/g, '/') + '?web=1'; },
    page: function (file, hash) {
      var base = Hub.preview || unreplaced(cfg.pagesUrl) ? file : cfg.pagesUrl + '/' + file;
      return base + (hash ? '#' + hash : '');
    }
  };

  /* ---------------- dates ---------------- */
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function validYMD(y, m, d) { return y > 1900 && y < 2200 && m >= 1 && m <= 12 && d >= 1 && d <= 31; }
  function parseDate(v, keepTime) {
    if (v == null || v === '') return null;
    if (v instanceof Date) return isNaN(v.getTime()) ? null : (keepTime ? v : startOfDay(v));
    if (typeof v === 'number') { var dn = new Date(v); return isNaN(dn.getTime()) ? null : (keepTime ? dn : startOfDay(dn)); }
    var s = clean(v), m, d;
    if (!s) return null;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) {
      return validYMD(+m[1], +m[2], +m[3]) ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
    }
    if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})[T ](\d{1,2}):(\d{2})(?::(\d{2}))?(?:\.\d+)?\s*(Z|[+-]\d{2}:?\d{2})?$/i))) {
      if (!validYMD(+m[1], +m[2], +m[3])) return null;
      if (m[7]) d = new Date(s.replace(' ', 'T').replace(/([+-]\d{2})(\d{2})$/, '$1:$2'));
      else d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
      if (isNaN(d.getTime())) return null;
      return keepTime ? d : startOfDay(d);
    }
    if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})(?:[ ,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp]\.?[Mm]\.?)?)?$/))) {
      var a = +m[1], b = +m[2], y = +m[3], mo = a, da = b, h = m[4] ? +m[4] : 0;
      if (y < 100) y += 2000;
      if (a > 12 && b <= 12) { mo = b; da = a; }
      if (!validYMD(y, mo, da)) return null;
      if (m[7]) { var pm = /p/i.test(m[7]); if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
      d = new Date(y, mo - 1, da, h, m[5] ? +m[5] : 0, m[6] ? +m[6] : 0);
      return keepTime ? d : startOfDay(d);
    }
    if ((m = s.match(/\/Date\((-?\d+)/))) { d = new Date(+m[1]); return keepTime ? d : startOfDay(d); }
    var t = Date.parse(s);
    if (!isNaN(t)) { d = new Date(t); return keepTime ? d : startOfDay(d); }
    return null;
  }
  /* "Today" is the viewer's date. window.__HUB_TODAY__ ('YYYY-MM-DD') is a test hook only; nothing in the pages sets it. */
  function today() {
    var o = window.__HUB_TODAY__ ? parseDate(window.__HUB_TODAY__) : null;
    return o || startOfDay(new Date());

    var b = closest(e.target, '[data-copy]');
    if (!b) return;
    e.preventDefault();
    var src = b.getAttribute('data-copy-from');
    var srcEl = src ? byId(src) : null;
    var text = srcEl ? srcEl.textContent : b.getAttribute('data-copy');
    Hub.copy(text, b, srcEl || b.querySelector('.chip__text'));
  });

  /* tooltips: Escape dismisses (WCAG 1.4.13); leaving re-arms */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' && e.key !== 'Esc') return;
    var h = closest(document.activeElement, '.hint');
    if (h && h.classList) h.classList.add('is-dismissed');
  });
  function rearm(e) { var h = closest(e.target, '.hint'); if (h && h.classList) h.classList.remove('is-dismissed'); }
  document.addEventListener('focusout', rearm);
  document.addEventListener('mouseout', rearm);

  /* ---------------- links between pages ----------------
     There is no in-page nav bar: SharePoint's site navigation is the primary nav. Static links to other pages
     carry data-page; before install (tokens not replaced) they point at the sibling file instead. */
  function initLinks() {
    var links = document.querySelectorAll ? document.querySelectorAll('[data-page]') : [];
    Array.prototype.forEach.call(links, function (a) {
      if (Hub.preview || unreplaced(cfg.pagesUrl)) a.setAttribute('href', a.getAttribute('data-page'));
    });
  }

  /* ---------------- AI workflows, grouped by Run Log "Workflow" value ----------------
     Capture is two workflows (one trigger each) running the same skill; both log as "Capture",
     so they share one health row here and both Settings cards show its last run. */
  Hub.WORKFLOWS = [
    { name: 'Capture', label: 'Capture obligations', skill: 'capture-obligations', tokens: ['CAPTURE_NEW', 'CAPTURE_CHANGED'], trigger: 'When a contract is added or changed', staleDays: null },
    { name: 'Assign owners', label: 'Assign owners', skill: 'assign-obligation-owners', tokens: ['ASSIGN_OWNERS'], trigger: 'Daily at 7:00 AM', staleDays: 2 },
    { name: 'Daily sweep', label: 'Daily sweep', skill: 'sweep-obligations', tokens: ['DAILY_SWEEP'], trigger: 'Daily at 6:00 AM', staleDays: 2 },
    { name: 'Owner digest', label: 'Owner digest', skill: 'obligation-owner-digest', tokens: ['OWNER_DIGEST'], trigger: 'Mondays at 8:00 AM', staleDays: 8 },
    { name: 'Leadership digest', label: 'Leadership digest', skill: 'obligation-leadership-digest', tokens: ['LEADERSHIP_DIGEST'], trigger: 'Fridays at 3:00 PM', staleDays: 8 }
  ];
  Hub.lastRuns = function (runs) {
    var any = runs.length > 0;   // on a brand-new site the setup checklist covers "never ran"
    return Hub.WORKFLOWS.map(function (w) {
      var k = normKey(w.name), kl = normKey(w.label);
      var mine = runs.filter(function (r) { var rk = normKey(r.workflow); return rk === k || rk === kl || (rk && rk.indexOf(k) === 0); });
      mine.sort(function (a, b) { return (b.at ? b.at.getTime() : 0) - (a.at ? a.at.getTime() : 0); });
      var last = mine[0] || null, issue = null;
      var age = last && last.at ? (now() - last.at) / DAY : null;
      if (last && /fail/i.test(last.outcome)) issue = { level: 'rose', text: w.label + ' failed ' + Hub.fmt.ago(last.at) + '.' };
      else if (w.staleDays && last && age !== null && age > w.staleDays) issue = { level: 'amber', text: w.label + ' hasn\u2019t run for ' + Math.floor(age) + ' days.' };
      else if (w.staleDays && !last && any) issue = { level: 'amber', text: w.label + ' hasn\u2019t run yet.' };
      return { wf: w, last: last, count: mine.length, issue: issue };
    });
  };

  /* ---------------- focus preservation across re-renders ---------------- */
  Hub.keepFocus = function (fn) {
    var a = document.activeElement, key = a && a.getAttribute ? a.getAttribute('data-focus') : null;
    fn();
    if (key && document.querySelector) { var n = document.querySelector('[data-focus="' + key.replace(/"/g, '') + '"]'); if (n && n.focus) n.focus(); }
  };

  /* ---------------- page bootstrap ---------------- */
  Hub.start = function (opts) {
    var data = null;
    function build() {
      data = {};
      opts.lists.forEach(function (k) { data[k] = loadList(k); });
      Hub.data = data;
      draw();
    }
    function draw() {
      try { opts.render(data, Hub.hash.get()); }
      catch (e) { Hub.fail(e); }
    }
    function hasLive() { return window.__LD_RESULTS__ && typeof window.__LD_RESULTS__ === 'object'; }
    function watchLate() {
      var waited = 0, t = setInterval(function () {
        waited += 250;
        if (hasLive()) { clearInterval(t); build(); }
        else if (waited >= LATE_WATCH_MS) clearInterval(t);
      }, 250);
    }
    try { initLinks(); } catch (e) { /* links work without it once installed */ }
    if (opts.lists.length === 0 || hasLive()) build();
    else {
      var waited = 0, t = setInterval(function () {
        waited += 100;
        if (hasLive() || waited >= LIVE_WAIT_MS) { clearInterval(t); build(); if (!hasLive()) watchLate(); }
      }, 100);
    }
    window.addEventListener('hashchange', function () { if (data) Hub.keepFocus(draw); });
    var rt = null;
    window.addEventListener('resize', function () {
      if (!data || !opts.onResize) return;
      clearTimeout(rt); rt = setTimeout(function () { try { opts.onResize(data); } catch (e) { /* ignore */ } }, 160);
    });
  };
})(window, document);

</script>
<script>
/* Leadership - exposure view. Only counts that come straight from the Obligations list; no invented metrics. */
(function (Hub) {
  'use strict';
  var esc = Hub.esc, fmt = Hub.fmt, icon = Hub.icon, plural = Hub.plural;
  var BAR = '#5A87C2', BAR_HI = '#3F3891', TRACK = '#E8EFF7';

  function countBy(list, fn) {
    var m = {};
    list.forEach(function (o) { var k = fn(o) || 'Not set'; m[k] = (m[k] || 0) + 1; });
    return Object.keys(m).map(function (k) { return { key: k, n: m[k] }; }).sort(function (a, b) { return b.n - a.n || a.key.localeCompare(b.key); });
  }
  function barSvg(n, hi, max) {
    var w = max ? (n / max) * 100 : 0, wh = max ? (hi / max) * 100 : 0;
    var grid = [25, 50, 75].map(function (g) { return '<line x1="' + g + '" x2="' + g + '" y1="0" y2="14" stroke="#FFFFFF" stroke-width=".6" vector-effect="non-scaling-stroke"/>'; }).join('');
    return '<svg viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true" focusable="false">' +
      '<rect x="0" y="2" width="100" height="10" rx="0" fill="' + TRACK + '"/>' +
      '<rect x="0" y="2" width="' + w.toFixed(2) + '" height="10" fill="' + BAR + '"/>' +
      (hi ? '<rect x="0" y="2" width="' + wh.toFixed(2) + '" height="10" fill="' + BAR_HI + '"/>' : '') + grid + '</svg>';
  }
  function barTable(id, caption, head, rows, max) {
    return '<table class="bars" id="' + id + '"><caption>' + esc(caption) + '</caption><thead><tr><th scope="col">' + esc(head) + '</th><th scope="col" class="num">Open</th><th scope="col"><span class="sr-only">Chart: high-risk part in dark, the rest in light blue</span></th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr><th scope="row">' + esc(r.key) + '<span class="sub">' + (r.hi ? r.hi + ' high risk' : 'none high risk') + '</span></th><td class="num">' + r.n + '</td><td class="bar">' + barSvg(r.n, r.hi, max) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }
  function sw(color, stroke) { return '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x=".5" y=".5" width="11" height="11" rx="3" fill="' + color + '"' + (stroke ? ' stroke="' + stroke + '"' : '') + '/></svg>'; }

  function render(data) {
    var all = data.OBLIGATIONS.rows.map(Hub.model.obligation);
    var open = all.filter(function (o) { return !o.closed; });
    var t = Hub.date.today();
    Hub.badge(data, 'OBLIGATIONS', all.length, 'obligation');
    var host = Hub.byId('lead');
    if (host) host.setAttribute('aria-busy', 'false');
    if (!all.length) {
      Hub.setHTML('page-sub', 'Nothing to report yet.');
      Hub.setHTML('lead', '<div class="section card state"><svg viewBox="0 0 120 96" aria-hidden="true"><rect x="20" y="58" width="16" height="22" rx="4" fill="#EAF3FC"/><rect x="44" y="40" width="16" height="40" rx="4" fill="#9AC7F5" opacity=".6"/><rect x="68" y="26" width="16" height="54" rx="4" fill="#8B83DB" opacity=".45"/><path d="M14 84h92" stroke="#D3DDE9" stroke-width="2"/></svg>' +
        '<h2>No obligations to report</h2><p>Exposure figures appear once contracts are added and capture has created obligations.</p></div>');
      return;
    }
    var isHigh = function (o) { return /high/i.test(o.risk); };
    var highOpen = open.filter(isHigh);
    var overdue = open.filter(function (o) { return o.timing === 'Overdue'; });
    var contracts = Hub.uniq(open.map(function (o) { return Hub.contractKey(o.contract); }).filter(Boolean)).length;
    var byStatus = {
      notStarted: open.filter(function (o) { return o.status !== 'In progress'; }).length,
      inProgress: open.filter(function (o) { return o.status === 'In progress'; }).length,
      fulfilled: all.filter(function (o) { return /fulfilled/i.test(o.status); }).length,
      other: all.filter(function (o) { return o.closed && !/fulfilled/i.test(o.status); }).length
    };
    Hub.setHTML('page-sub', esc(plural(open.length, 'open obligation') + ' across ' + plural(contracts, 'contract') + '; ' + highOpen.length + ' of them high risk and ' + overdue.length + ' overdue today.'));

    var html = '';
    // headline figures
    var stats = [
      ['Open', open.length, plural(byStatus.inProgress, 'item') + ' in progress'],
      ['Fulfilled', byStatus.fulfilled, byStatus.other ? byStatus.other + ' waived or not applicable' : 'Marked fulfilled in the list'],
      ['High-risk open', highOpen.length, highOpen.filter(function (o) { return o.timing === 'Overdue' || o.timing === 'Due soon'; }).length + ' due within 14 days or overdue'],
      ['Overdue today', overdue.length, overdue.length ? 'Oldest ' + fmt.due(overdue.slice().sort(Hub.byDue)[0].due) : 'Nothing past due']
    ];
    html += '<section class="section" aria-labelledby="s-title"><h2 class="sr-only" id="s-title">Headline figures</h2><div class="stats">' + stats.map(function (s, i) {
      return '<div class="card stat settle" style="--d:' + i + '"><span class="stat__label">' + esc(s[0]) + '</span><span class="stat__value">' + s[1] + '</span><span class="stat__note">' + esc(s[2]) + '</span></div>';
    }).join('') + '</div></section>';

    // what the risk levels mean (the legend for every High / Medium or low split below)
    html += '<section class="section card card--tint risk-key settle" aria-labelledby="rk-title"><h2 id="rk-title">What the risk levels mean</h2>' +
      '<dl class="risk-key__list">' + Hub.RISK_LEVELS.map(function (r) {
        return '<div><dt>' + sw(r.level === 'High' ? BAR_HI : BAR) + esc(r.level) + '</dt><dd>' + esc(r.text) + '</dd></div>';
      }).join('') + '</dl><p class="risk-key__note">Charts show High in dark and Medium and Low together in light blue. Change an item\u2019s Risk in the Obligations list if it doesn\u2019t fit.</p></section>';

    // open vs fulfilled
    var total = open.length + byStatus.fulfilled + byStatus.other;
    var segs = [['Not started', byStatus.notStarted, '#5A87C2'], ['In progress', byStatus.inProgress, '#8B83DB'], ['Fulfilled', byStatus.fulfilled, '#2F7A5C'], ['Waived or not applicable', byStatus.other, '#9CA3AF']];
    var x = 0, rects = segs.map(function (s) { var w = total ? s[1] / total * 100 : 0, r = '<rect x="' + x.toFixed(2) + '" y="0" width="' + Math.max(0, w - (w ? .4 : 0)).toFixed(2) + '" height="16" fill="' + s[2] + '"/>'; x += w; return r; }).join('');
    var openCard = '<section class="card settle" aria-labelledby="ovf-title"><h2 id="ovf-title">Open vs fulfilled</h2><p class="muted" style="font-size:14px;margin-top:2px">Every tracked obligation by status.</p>' +
      '<svg class="split" viewBox="0 0 100 16" preserveAspectRatio="none" aria-hidden="true"><clipPath id="split-c"><rect width="100" height="16" rx="3"/></clipPath><g clip-path="url(#split-c)"><rect width="100" height="16" fill="' + TRACK + '"/>' + rects + '</g></svg>' +
      '<ul class="legend">' + segs.filter(function (s) { return s[1]; }).map(function (s) { return '<li>' + sw(s[2]) + '<span>' + esc(s[0]) + ' <strong>' + s[1] + '</strong></span></li>'; }).join('') + '</ul></section>';

    // we owe vs owed to us
    var party = { Us: 0, Counterparty: 0, Both: 0 };
    open.forEach(function (o) { if (party[o.party] !== undefined) party[o.party]++; });
    var oweCard = '<section class="card settle" style="--d:1" aria-labelledby="owe-title"><h2 id="owe-title">What we owe vs what we\u2019re owed</h2><p class="muted" style="font-size:14px;margin-top:2px">Open obligations by who owes them.</p>' +
      '<div class="owe"><div><strong>' + party.Us + '</strong><span>We owe</span></div><div><strong>' + party.Counterparty + '</strong><span>Owed to us</span></div><div><strong>' + party.Both + '</strong><span>Mutual</span></div></div></section>';
    html += '<div class="section grid-2">' + openCard + oweCard + '</div>';

    // category + counterparty bars
    var cats = countBy(open, function (o) { return o.category; });
    cats.forEach(function (c) { c.hi = open.filter(function (o) { return (o.category || 'Not set') === c.key && isHigh(o); }).length; });
    var cps = countBy(open, function (o) { return Hub.shortParty(o.counterparty); });
    cps.forEach(function (c) { c.hi = open.filter(function (o) { return (Hub.shortParty(o.counterparty) || 'Not set') === c.key && isHigh(o); }).length; });
    var max = Math.max.apply(null, cats.concat(cps).map(function (c) { return c.n; }).concat([1]));
    var key = '<ul class="legend" style="margin:0 0 8px">' + '<li>' + sw(BAR_HI) + 'High risk</li><li>' + sw(BAR) + 'Medium or low risk</li></ul>';
    html += '<div class="section grid-2">' +
      '<section class="card settle" aria-labelledby="cat-title"><div class="card__head"><div><h2 id="cat-title">By category</h2></div><a class="link-arrow" href="' + esc(Hub.url.view('OBLIGATIONS')) + '" target="_top">Open list' + icon('arrow') + '</a></div>' + key +
      barTable('t-cat', 'Open obligations by category, with how many are high risk.', 'Category', cats, max) + '</section>' +
      '<section class="card settle" style="--d:1" aria-labelledby="cp-title"><div class="card__head"><div><h2 id="cp-title">By counterparty</h2></div></div>' + key +
      barTable('t-cp', 'Open obligations by counterparty, with how many are high risk.', 'Counterparty', cps, max) + '</section></div>';

    // next 90 days by month
    var end = Hub.date.addDays(t, 90), buckets = [];
    for (var d = new Date(t.getFullYear(), t.getMonth(), 1); d <= end; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
      var from = d < t ? t : d, last = new Date(d.getFullYear(), d.getMonth() + 1, 0), to = last > end ? end : last;
      var n = open.filter(function (o) { return o.due && o.due >= from && o.due <= to; });
      buckets.push({ label: fmt.month(d, d.getMonth() === 0 || buckets.length === 0), range: from.getDate() + '\u2013' + to.getDate(), partial: from.getDate() !== 1 || to.getDate() !== last.getDate(), n: n.length, hi: n.filter(isHigh).length });
    }
    var mmax = Math.max.apply(null, buckets.map(function (b) { return b.n; }).concat([1]));
    var monthCard = '<section class="card settle" aria-labelledby="m-title"><h2 id="m-title" class="card__head">Next 90 days by month</h2>' +
      '<table class="months"><caption>Open obligations due from today to ' + esc(fmt.date(end)) + '. Overdue items are not included.</caption><thead><tr>' + buckets.map(function (b) { return '<th scope="col">' + esc(b.label) + '<small>' + esc(b.partial ? 'Days ' + b.range : 'Whole month') + '</small></th>'; }).join('') + '</tr></thead><tbody><tr>' +
      buckets.map(function (b) {
        var h = Math.round(b.n / mmax * 100), hh = Math.round(b.hi / mmax * 100);
        return '<td><span>' + b.n + '</span><svg viewBox="0 0 40 100" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="0" width="40" height="100" rx="4" fill="' + TRACK + '"/>' +
          (h ? '<rect x="0" y="' + (100 - h) + '" width="40" height="' + h + '" rx="4" fill="' + BAR + '"/>' : '') + (hh ? '<rect x="0" y="' + (100 - hh) + '" width="40" height="' + hh + '" rx="4" fill="' + BAR_HI + '"/>' : '') + '</svg>' +
          '<span class="sr-only"> due, ' + b.hi + ' high risk</span></td>';
      }).join('') + '</tr></tbody></table>' +
      '<ul class="legend"><li>' + sw(BAR_HI) + 'High risk</li><li>' + sw(BAR) + 'Medium or low risk</li></ul></section>';

    // no history note
    var histCard = '<section class="card card--tint settle" style="--d:1" aria-labelledby="hist-title"><h2 id="hist-title" class="card__head">Trend over time</h2>' +
      '<p class="nohist"><svg aria-hidden="true"><use href="#i-pulse"></use></svg><span>Not shown. The Obligations list keeps each item\u2019s current state only, so there is no history to chart an overdue trend from. The Leadership digest each Friday is the record of how things stood that week.</span></p></section>';
    html += '<div class="section grid-2">' + monthCard + histCard + '</div>';

    // high-risk list
    var hiList = highOpen.slice().sort(Hub.byDue);
    html += '<section class="section card card--flush settle" aria-labelledby="hr-title"><div class="card__head pad"><div><h2 id="hr-title">High-risk open items</h2><p>' + plural(hiList.length, 'item') + ', soonest first.</p></div>' +
      '<a class="link-arrow" href="' + esc(Hub.url.view('OBLIGATIONS', [['Risk', 'High']])) + '" target="_top">Open in list' + icon('arrow') + '</a></div>' +
      (hiList.length ? '<div class="table-wrap"><table class="table table--stack"><caption class="sr-only">High-risk open obligations</caption><thead><tr><th scope="col">Due</th><th scope="col">Obligation</th><th scope="col">Counterparty</th><th scope="col">Owner</th><th scope="col">Timing</th></tr></thead><tbody>' +
        hiList.map(function (o) {
          return '<tr><td data-label="Due" class="nowrap">' + (o.due ? '<strong>' + esc(fmt.short(o.due)) + '</strong>' : '<span class="muted">' + esc(o.triggerType === 'Ongoing' ? 'Ongoing' : 'On trigger') + '</span>') + '</td>' +
            '<td class="cell-lead"><a class="cell-title" href="' + esc(Hub.url.disp('OBLIGATIONS', o.id)) + '" target="_top">' + esc(o.title) + '</a><span class="cell-sub">' + esc(o.category) + '</span></td>' +
            '<td data-label="Counterparty">' + esc(o.counterparty || '\u2014') + '</td><td data-label="Owner">' + Hub.ownerText(o) + '</td><td data-label="Timing"><span>' + Hub.timingPill(o.timing) + Hub.timingNote(o) + '</span></td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="pad" style="padding-bottom:24px"><p class="muted">No high-risk obligations are open.</p></div>') + '</section>';

    Hub.setHTML('lead', html);
  }

  Hub.start({ lists: ['OBLIGATIONS'], render: render });
})(window.Hub);

</script>
</body>
</html>

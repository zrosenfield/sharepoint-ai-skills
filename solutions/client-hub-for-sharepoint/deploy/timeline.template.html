<!DOCTYPE html>
<html lang="en">
<head>
__MANIFEST__
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client activity: visual timeline</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b1f24;--sub:#5b6470;--faint:#8a94a3;--line:#e6e8ec;--grid:#eef0f3;--brand:#0f6cbd;--brand-2:#115ea3;--soft:#eef4fb;
--ok:#107c10;--ok-bg:#e7f5e6;--warn:#8a5300;--warn-bg:#fff4ce;--bad:#b10e1c;--bad-bg:#fde7e9;--muted-bg:#f1f2f4;--gold:#b98900;--r:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.app{max-width:1600px;margin:0 auto;padding:18px 20px 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}.brand h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.2px}
.brand p{margin:2px 0 0;color:var(--sub);font-size:13px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#5b3fd1,#0f6cbd 55%,#3aa0f3);display:grid;place-items:center;box-shadow:0 4px 12px rgba(15,108,189,.25)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--muted-bg);color:var(--sub)}
.badge.live{background:var(--ok-bg);color:var(--ok)}.badge.part{background:var(--warn-bg);color:var(--warn)}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 12px;font:600 13px/1 inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#c8ccd2}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
.kpi.bad:before{background:var(--bad)}.kpi.warn:before{background:#e8a317}.kpi.purple:before{background:#8a3ffc}.kpi.ok:before{background:var(--ok)}
.kpi .l{font-size:12px;color:var(--sub);font-weight:600}.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.kpi.bad .v{color:var(--bad)}.kpi .s{font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:1050px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{appearance:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font:600 12px/1 inherit;font-family:inherit;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .sw{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.off{color:var(--faint);background:#fafbfc}.chip.off .sw{opacity:.3}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{appearance:none;border:0;background:#fff;padding:6px 10px;font:600 12px/1 inherit;font-family:inherit;color:var(--sub);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--soft);color:var(--brand-2)}
.toggle{font-size:12px;color:var(--sub);display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--brand)}
#chart{position:relative;padding:4px 6px 8px}
#chart svg{display:block;width:100%;height:auto;overflow:visible}
.lane-label{cursor:pointer}.lane-label:hover .ln{fill:var(--brand-2)}
.mk{cursor:pointer;transition:opacity .25s ease}
.mk .shape{transition:transform .15s ease;transform-box:fill-box;transform-origin:center}
.mk:hover .shape,.mk:focus .shape{transform:scale(1.35)}
.mk:focus{outline:none}
.mk.sel .shape{stroke:#1b1f24;stroke-width:2.5;transform:scale(1.45)}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.4)}to{opacity:1;transform:none}}
.lane{transition:opacity .25s ease}.lane.dim{opacity:.22}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:8px 14px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{position:absolute;pointer-events:none;background:#1b1f24;color:#fff;border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.4;max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease;z-index:5}
.tip.on{opacity:1;transform:none}.tip b{font-size:13px}.tip .m{color:#b9c1cc}
.side{padding:14px 16px}
.side h2{font-size:15px;margin:0 0 2px}.side .hint{font-size:12px;color:var(--sub);margin:0 0 10px}
.att{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.att li{border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:10px;padding:8px 10px;cursor:pointer;background:#fff}
.att li:hover{border-color:#c8ccd2}.att li.od{border-left-color:var(--bad)}.att li.soon{border-left-color:#e8a317}
.att .t{font-weight:600;font-size:13px}.att .m{font-size:12px;color:var(--sub)}
.att .m b{color:var(--bad)}
.sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--muted-bg);color:var(--sub)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.det h3{font-size:17px;margin:8px 0 4px;line-height:1.3}.det .meta{font-size:12.5px;color:var(--sub);margin-bottom:10px}
.det .notes{font-size:13.5px;line-height:1.55;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.fu{margin-top:10px;border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.fu.od{background:var(--bad-bg);border-color:#f3c5ca}.fu.soon{background:var(--warn-bg);border-color:#f1dea0}
.fu .l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.close{float:right;appearance:none;border:0;background:none;font-size:18px;line-height:1;color:var(--faint);cursor:pointer;padding:2px 4px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--grid);cursor:pointer;font-size:12.5px}
.hist li:hover .ht{color:var(--brand-2)}.hist .hd{color:var(--faint);white-space:nowrap;min-width:48px}.hist .sw{width:8px;height:8px;border-radius:2px;flex:none;transform:translateY(-1px)}
a{color:var(--brand)}a:hover{color:var(--brand-2)}
.empty{color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div class="app" id="app"><div class="empty" style="padding:40px;text-align:center">Loading the timeline…</div></div>
<script type="application/json" id="snapshot">__SNAPSHOT__</script>
<script type="application/json" id="cfg">__CONFIG__</script>
<script>
(function(){
"use strict";
var CFG=JSON.parse(document.getElementById("cfg").textContent||"{}");
var SNAP=JSON.parse(document.getElementById("snapshot").textContent||"{}");
var KEYS=CFG.keys||{};
var TYPES=[{k:"Meeting",c:"#0f6cbd",s:"circle"},{k:"Call",c:"#47a3e6",s:"circle"},{k:"Email",c:"#7a8699",s:"circle"},
           {k:"Decision",c:"#8a3ffc",s:"diamond"},{k:"Change",c:"#0b8a7a",s:"square"},{k:"Issue",c:"#d13438",s:"triangle"}];
var TC={};TYPES.forEach(function(t){TC[t.k]=t;});
var SEV={"At risk":0,"Needs attention":1,"On track":2};
var RANGES=[["3m","3 months",91],["6m","6 months",182],["12m","12 months",365],["all","All",0]];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DAY=86400000;

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function maybeJson(s){ if(typeof s!=="string") return s; var t=s.trim(); if((t.charAt(0)==="["&&t.charAt(t.length-1)==="]")||(t.charAt(0)==="{"&&t.charAt(t.length-1)==="}")){ try{return JSON.parse(t);}catch(e){} } return s; }
function txt(v){
  v=maybeJson(v); if(v==null) return "";
  if(Array.isArray(v)) return v.map(txt).filter(Boolean).join(", ");
  if(typeof v==="object") return txt(v.lookupValue||v.title||v.Title||v.displayValue||v.DisplayName||v.text||v.value||v.Label||v.label||v.email||v.Url||"");
  var s=String(v).trim();
  if(/^\d+;#/.test(s)) s=s.replace(/^\d+;#/,"");
  s=s.replace(/;#\d+;#/g,", ");
  if(s.indexOf(";#")>=0) s=s.split(";#").filter(Boolean).join(", ");
  return s;
}
function num(v){ var n=parseFloat(txt(v).replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; }
function day(v){
  var s=txt(v); if(!s) return null; var m;
  if((m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s))) return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s))) return new Date(+m[3],+m[1]-1,+m[2]);
  var d=new Date(s); return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function url(v){ v=maybeJson(v); if(v&&typeof v==="object") return v.Url||v.url||""; return txt(v).split(",")[0].trim(); }
function get(o,k){ if(!o) return undefined; if(k in o) return o[k]; var lk=k.toLowerCase(); for(var x in o){ if(x.toLowerCase()===lk) return o[x]; } return undefined; }
var TODAY=(function(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());})();
function days(d){ return d?Math.round((d-TODAY)/DAY):null; }
function fmt(d,y){ if(!d) return ""; return MON[d.getMonth()]+" "+d.getDate()+((y===true||(y!==false&&d.getFullYear()!==TODAY.getFullYear()))?", "+d.getFullYear():""); }
function money(n){ if(n>=1e6) return "$"+(Math.round(n/1e4)/100).toString().replace(/0$/,"")+"M"; if(n>=1e3) return "$"+Math.round(n/1e3)+"K"; return "$"+n; }
function plural(n,w,p){ return n+" "+(n===1?w:(p||w+"s")); }
function itemUrl(id){ return (id&&CFG.lists&&CFG.lists.activity)?CFG.lists.activity+"/DispForm.aspx?ID="+encodeURIComponent(txt(id)):""; }

/* ---------- data: live rows, else the embedded snapshot ---------- */
function liveRows(key){
  var all=window.__LD_RESULTS__||{}; var r=all[key];
  if(!r||r.format!=="rows"||!r.content) return null;
  try{ var p=typeof r.content==="string"?JSON.parse(r.content):r.content; var h=p.headers||[];
    return (p.rows||[]).map(function(a){ var o={}; for(var i=0;i<h.length;i++){ o[h[i]]=a[i]; o[String(h[i]).replace(/_x([0-9a-fA-F]{4})_/g,function(s,c){return String.fromCharCode(parseInt(c,16));})]=a[i]; } return o; });
  }catch(e){ return null; }
}
function load(){
  var src={},out={};
  ["activity","clients"].forEach(function(n){ var rows=KEYS[n]?liveRows(KEYS[n]):null; src[n]=rows?"live":"snapshot"; out[n]=rows||SNAP[n]||[]; });
  var clients=out.clients.map(function(r){ return {name:txt(get(r,"Title")),health:txt(get(r,"Health")),value:num(get(r,"AnnualValue")),renewal:day(get(r,"RenewalDate"))}; }).filter(function(c){return c.name;});
  var acts=out.activity.map(function(r,i){ return {
    id:txt(get(r,"ID")||get(r,"Id"))||("s"+i), title:txt(get(r,"Title")), client:txt(get(r,"Client")), type:txt(get(r,"ActivityType")), date:day(get(r,"ActivityDate")),
    notes:txt(get(r,"Notes")), owner:txt(get(r,"Owner")), follow:txt(get(r,"FollowUp")), step:txt(get(r,"NextStep")), due:day(get(r,"NextStepDue")),
    ticket:url(get(r,"TicketLink")), sentiment:txt(get(r,"Sentiment")) }; }).filter(function(a){return a.date&&a.client;});
  acts.sort(function(a,b){return a.date-b.date;});
  var seen={}; clients.forEach(function(c){seen[c.name]=1;});
  acts.forEach(function(a){ if(!seen[a.client]){ seen[a.client]=1; clients.push({name:a.client,health:"",value:0,renewal:null}); } });
  clients.sort(function(a,b){ return ((SEV[a.health]==null?3:SEV[a.health])-(SEV[b.health]==null?3:SEV[b.health]))||(b.value-a.value)||a.name.localeCompare(b.name); });
  return {src:src,clients:clients,acts:acts};
}

/* ---------- state ---------- */
var D=null, S={range:"12m", off:{}, focus:"", sel:"", fu:true}, firstDraw=true;
function fuState(a){ if(a.follow!=="Open"||!a.due) return ""; var n=days(a.due); return n<0?"od":n<=7?"soon":"later"; }
function fuColor(st){ return st==="od"?"#b10e1c":st==="soon"?"#d68a00":"#8a94a3"; }
function hcls(h){ return h==="On track"?"ok":h==="Needs attention"?"warn":h==="At risk"?"bad":""; }
function hcol(h){ return h==="On track"?"#107c10":h==="Needs attention"?"#e8a317":h==="At risk"?"#d13438":"#c8ccd2"; }
function scoped(){ return S.focus?D.acts.filter(function(a){return a.client===S.focus;}):D.acts; }
function byId(id){ for(var i=0;i<D.acts.length;i++) if(D.acts[i].id===id) return D.acts[i]; return null; }

/* ---------- page ---------- */
function render(){
  var A=scoped(), open=A.filter(function(a){return a.follow==="Open";}), od=open.filter(function(a){return fuState(a)==="od";});
  var last30=A.filter(function(a){var n=days(a.date);return n<=0&&n>-30;}), prev30=A.filter(function(a){var n=days(a.date);return n<=-30&&n>-60;});
  var dec90=A.filter(function(a){var n=days(a.date);return a.type==="Decision"&&n<=0&&n>-90;});
  var conc30=last30.filter(function(a){return a.sentiment==="Concerned";});
  var soon=open.filter(function(a){return fuState(a)==="soon";});
  var oldest=od.reduce(function(m,a){return Math.max(m,-days(a.due));},0);
  var nLive=["activity","clients"].filter(function(k){return D.src[k]==="live";}).length;
  var badge=nLive===2?'<span class="badge live"><i></i>Live · 2 lists</span>':nLive===0?'<span class="badge"><i></i>Sample snapshot</span>':'<span class="badge part"><i></i>Live · 1 of 2 lists</span>';
  var first=D.acts.length?D.acts[0].date:TODAY;
  var h='<header class="top"><div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 12h18" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55"/><circle cx="6" cy="12" r="2.6" fill="#fff"/><path d="M12 8.6l3.4 3.4-3.4 3.4-3.4-3.4z" fill="#fff"/><circle cx="18.5" cy="12" r="2.6" fill="none" stroke="#fff" stroke-width="2"/></svg></div>';
  h+='<div><h1>Client activity'+(S.focus?' · '+esc(S.focus):'')+'</h1><p>'+plural(A.length,"entry","entries")+' · '+(S.focus?'one client':plural(D.clients.length,"client"))+' · '+fmt(first,true)+' to today</p></div></div>';
  h+='<div class="actions">'+badge+'<button class="btn" data-act="refresh" title="Ask SharePoint for fresh rows">↻ Refresh</button>';
  if(CFG.formUrl) h+='<a class="btn primary" href="'+esc(CFG.formUrl)+'" target="_blank" rel="noopener">+ Log activity</a>';
  h+='</div></header>';
  h+='<section class="kpis">';
  h+='<div class="kpi"><div class="l">Entries · last 30 days</div><div class="v">'+last30.length+'</div><div class="s">'+(prev30.length?(last30.length>=prev30.length?'up from ':'down from ')+prev30.length+' the 30 days before':'nothing the 30 days before')+'</div></div>';
  h+='<div class="kpi purple"><div class="l">Decisions · last 90 days</div><div class="v">'+dec90.length+'</div><div class="s">'+(dec90.length?'latest '+fmt(dec90[dec90.length-1].date):'none logged')+'</div></div>';
  h+='<div class="kpi '+(soon.length?'warn':'')+'"><div class="l">Open follow-ups</div><div class="v">'+open.length+'</div><div class="s">'+soon.length+' due in the next 7 days</div></div>';
  h+='<div class="kpi '+(od.length?'bad':'ok')+'"><div class="l">Overdue</div><div class="v">'+od.length+'</div><div class="s">'+(od.length?'oldest '+plural(oldest,"day")+' late':'nothing late')+'</div></div>';
  h+='<div class="kpi '+(conc30.length?'bad':'ok')+'"><div class="l">Concerned · last 30 days</div><div class="v">'+conc30.length+'</div><div class="s">'+(conc30.length?esc(uniq(conc30.map(function(a){return a.client;})).slice(0,2).join(", ")):'no worried clients')+'</div></div>';
  h+='</section>';
  h+='<div class="grid"><section class="card"><div class="bar"><div class="chips">';
  TYPES.forEach(function(t){ h+='<button class="chip'+(S.off[t.k]?' off':'')+'" data-type="'+t.k+'"><span class="sw" style="background:'+t.c+'"></span>'+t.k+'</button>'; });
  h+='</div><div class="chips"><label class="toggle"><input type="checkbox" data-act="fu"'+(S.fu?' checked':'')+'>Follow-ups</label><div class="seg">';
  RANGES.forEach(function(r){ h+='<button data-range="'+r[0]+'" class="'+(S.range===r[0]?'on':'')+'">'+r[1]+'</button>'; });
  h+='</div></div></div><div id="chart"></div>';
  h+='<div class="legend">';
  TYPES.forEach(function(t){ h+='<span>'+legendShape(t)+t.k+'</span>'; });
  h+='<span><svg width="18" height="14"><circle cx="9" cy="7" r="6.5" fill="rgba(209,52,56,.18)"/><circle cx="9" cy="7" r="3.5" fill="#7a8699"/></svg>Concerned</span>';
  h+='<span><svg width="26" height="14"><path d="M2 7h14" stroke="#b10e1c" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M18 2v10" stroke="#b10e1c" stroke-width="1.6"/><path d="M18 2.5h6l-2 2.2 2 2.2h-6z" fill="#b10e1c"/></svg>Follow-up due (red = overdue)</span>';
  h+='<span><svg width="16" height="14"><circle cx="8" cy="7" r="5.5" fill="#fff7d6" stroke="#b98900" stroke-width="1.6"/><path d="M8 4.4v5.2M5.4 7h5.2" stroke="#b98900" stroke-width="1.4"/></svg>Renewal</span>';
  h+='</div></section><aside class="card side" id="side"></aside></div>';
  document.getElementById("app").innerHTML=h;
  drawChart(); drawSide();
}
function uniq(a){ var o=[],s={}; a.forEach(function(x){ if(!s[x]){s[x]=1;o.push(x);} }); return o; }
function legendShape(t){ return '<svg width="14" height="14" viewBox="0 0 14 14">'+shape(t.s,7,7,t.s==="diamond"?5:5.2,t.c,"")+'</svg>'; }
function shape(s,x,y,r,c,extra){
  if(s==="diamond"){ var q=r*1.3; return '<path class="shape" d="M'+x+' '+(y-q)+'L'+(x+q)+' '+y+'L'+x+' '+(y+q)+'L'+(x-q)+' '+y+'Z" fill="'+c+'"'+extra+'/>'; }
  if(s==="square"){ var w=r*1.8; return '<rect class="shape" x="'+(x-w/2)+'" y="'+(y-w/2)+'" width="'+w+'" height="'+w+'" rx="2.2" fill="'+c+'"'+extra+'/>'; }
  if(s==="triangle"){ var a=r*1.35; return '<path class="shape" d="M'+x+' '+(y-a)+'L'+(x+a*0.98)+' '+(y+a*0.72)+'L'+(x-a*0.98)+' '+(y+a*0.72)+'Z" fill="'+c+'" stroke-linejoin="round"'+extra+'/>'; }
  return '<circle class="shape" cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"'+extra+'/>';
}

/* ---------- chart ---------- */
function drawChart(){
  var host=document.getElementById("chart"); if(!host) return;
  var W=Math.max(640,(host.clientWidth||1000)-12), LW=208, PR=26, AX=28, LH=50, VH=74, GAP=26;
  var rg=RANGES.filter(function(r){return r[0]===S.range;})[0]||RANGES[2];
  var t0=rg[2]?new Date(TODAY.getTime()-rg[2]*DAY):(D.acts.length?new Date(D.acts[0].date.getTime()-10*DAY):new Date(TODAY.getTime()-365*DAY));
  var lastDue=D.acts.reduce(function(m,a){ return (a.follow==="Open"&&a.due&&a.due>m)?a.due:m; },TODAY);
  var ahead=Math.min(120,Math.max(60,Math.round((lastDue-TODAY)/DAY)+7));
  var span=(TODAY-t0)/DAY; ahead=Math.min(ahead,Math.max(21,Math.round(span*0.35)));
  var t1=new Date(TODAY.getTime()+ahead*DAY);
  var x0=LW, x1=W-PR, sx=function(d){ return x0+(d-t0)/(t1-t0)*(x1-x0); };
  var lanes=D.clients, H=AX+lanes.length*LH+GAP+VH+30;
  var vis=D.acts.filter(function(a){return !S.off[a.type];});
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Client activity over time, one lane per client">';
  s+='<defs><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#eef4fb" stop-opacity=".9"/></linearGradient>';
  s+='<filter id="sh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0b1a2b" flood-opacity=".22"/></filter></defs>';
  // future band
  s+='<rect x="'+sx(TODAY)+'" y="'+(AX-6)+'" width="'+(x1-sx(TODAY))+'" height="'+(lanes.length*LH+6)+'" fill="#f6f9fd"/>';
  // month grid + labels
  var m=new Date(t0.getFullYear(),t0.getMonth()+1,1), short=(t1-t0)/DAY<=130;
  if(short){ var w=new Date(t0.getTime()); w.setDate(w.getDate()+((8-w.getDay())%7)); for(;w<t1;w=new Date(w.getTime()+7*DAY)){ s+='<line x1="'+sx(w)+'" x2="'+sx(w)+'" y1="'+AX+'" y2="'+(AX+lanes.length*LH)+'" stroke="#f3f4f6"/>'; } }
  var lastEnd=-1e9;
  for(;m<t1;m=new Date(m.getFullYear(),m.getMonth()+1,1)){
    var X=sx(m); if(X<x0+2) continue;
    s+='<line x1="'+X+'" x2="'+X+'" y1="'+(AX-4)+'" y2="'+(AX+lanes.length*LH+GAP+VH)+'" stroke="#e9ecf0"/>';
    var lab=MON[m.getMonth()]+(m.getMonth()===0?' '+m.getFullYear():''), lw=lab.length*6.8+4;
    if(X+5>lastEnd+6&&X+5+lw<W){ s+='<text x="'+(X+5)+'" y="'+(AX-10)+'" font-size="11.5" fill="#5b6470" font-weight="600">'+lab+'</text>'; lastEnd=X+5+lw; }
  }
  // lanes
  lanes.forEach(function(c,i){
    var y=AX+i*LH, cy=y+LH/2, dim=S.focus&&S.focus!==c.name;
    s+='<g class="lane'+(dim?' dim':'')+'" data-lane="'+esc(c.name)+'">';
    if(i%2===0) s+='<rect x="0" y="'+y+'" width="'+W+'" height="'+LH+'" fill="#fafbfc" opacity=".8"/>';
    s+='<line x1="'+x0+'" x2="'+x1+'" y1="'+cy+'" y2="'+cy+'" stroke="#e3e6ea" stroke-width="1.2"/>';
    s+='<g class="lane-label" data-focus="'+esc(c.name)+'"><rect x="0" y="'+y+'" width="'+(LW-10)+'" height="'+LH+'" fill="transparent"/>';
    s+='<circle cx="12" cy="'+(cy-6)+'" r="4.5" fill="'+hcol(c.health)+'"/>';
    s+='<text class="ln" x="24" y="'+(cy-2)+'" font-size="13" font-weight="'+(S.focus===c.name?700:600)+'" fill="'+(S.focus===c.name?'#115ea3':'#1b1f24')+'">'+esc(trunc(c.name,24))+'</text>';
    var sub=[]; if(c.value) sub.push(money(c.value)); if(c.renewal){ var rn=days(c.renewal); sub.push(rn>=0?'renews '+fmt(c.renewal)+(rn<=90?' ('+rn+'d)':''):'renewal passed'); }
    s+='<text x="24" y="'+(cy+13)+'" font-size="11" fill="'+(c.renewal&&days(c.renewal)>=0&&days(c.renewal)<=90?'#8a5300':'#5b6470')+'">'+esc(sub.join(' · '))+'</text></g>';
    // renewal pin
    if(c.renewal&&c.renewal>=t0&&c.renewal<=t1){ var rx=sx(c.renewal);
      s+='<line x1="'+rx+'" x2="'+rx+'" y1="'+(y+6)+'" y2="'+(y+LH-6)+'" stroke="#b98900" stroke-dasharray="2 3" stroke-width="1.3"/>';
      s+='<g filter="url(#sh)"><circle cx="'+rx+'" cy="'+cy+'" r="7.5" fill="#fff7d6" stroke="#b98900" stroke-width="1.8"/></g><path d="M'+rx+' '+(cy-3.6)+'v7.2M'+(rx-3.6)+' '+cy+'h7.2" stroke="#b98900" stroke-width="1.6"/>';
      var lft=rx+120>x1; s+='<text x="'+(lft?rx-11:rx+11)+'" y="'+(y+13)+'"'+(lft?' text-anchor="end"':'')+' font-size="10.5" font-weight="700" fill="#8a6500">Renews '+fmt(c.renewal,false)+'</text>'; }
    // markers with simple collision offsets
    var mine=vis.filter(function(a){return a.client===c.name&&a.date>=t0&&a.date<=t1;}), slots=[-1e9,-1e9,-1e9], off=[0,-11,11];
    var place=mine.map(function(a){ var X=sx(a.date), k=0; for(var j=0;j<3;j++){ if(X-slots[j]>=13){k=j;break;} if(j===2){ k=[0,1,2].sort(function(p,q){return slots[p]-slots[q];})[0]; } } slots[k]=X; return {a:a,x:X,y:cy+off[k]}; });
    // follow-up connectors under markers
    if(S.fu) place.forEach(function(p){ var st=fuState(p.a); if(!st) return; var col=fuColor(st), fx=Math.min(x1,sx(p.a.due));
      s+='<path d="M'+p.x+' '+p.y+'L'+fx+' '+p.y+'" stroke="'+col+'" stroke-width="1.6" stroke-dasharray="4 4" opacity=".75" fill="none"/>';
      s+='<g class="mk" data-id="'+esc(p.a.id)+'" tabindex="0" aria-label="Follow-up: '+esc(p.a.step)+'"><path class="shape" d="M'+fx+' '+(p.y-10)+'v15" stroke="'+col+'" stroke-width="1.8"/><path d="M'+fx+' '+(p.y-10)+'h9l-2.6 3.2 2.6 3.2h-9z" fill="'+col+'"/></g>'; });
    place.forEach(function(p,k){ var a=p.a, t=TC[a.type]||{c:"#7a8699",s:"circle"}, sel=S.sel===a.id;
      var delay=firstDraw?Math.min(900,Math.round((p.x-x0)/(x1-x0)*700)+i*25):0;
      s+='<g class="mk'+(sel?' sel':'')+(firstDraw?' pop':'')+'" data-id="'+esc(a.id)+'" tabindex="0" aria-label="'+esc(fmt(a.date,true)+', '+a.type+': '+a.title)+'"'+(delay?' style="animation-delay:'+delay+'ms"':'')+'>';
      if(a.sentiment==="Concerned") s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="11.5" fill="rgba(209,52,56,.16)"/>';
      s+=shape(t.s,p.x,p.y,t.s==="diamond"?5.6:6,t.c,' stroke="#fff" stroke-width="1.6" filter="url(#sh)"');
      s+='</g>'; });
    s+='</g>';
  });
  // today line
  var tx=sx(TODAY);
  var ty=AX+lanes.length*LH+GAP+VH;
  s+='<line x1="'+tx+'" x2="'+tx+'" y1="'+(AX-6)+'" y2="'+(ty+6)+'" stroke="#0f6cbd" stroke-width="1.6"/>';
  s+='<rect x="'+(tx-50)+'" y="'+(ty+6)+'" width="100" height="18" rx="9" fill="#0f6cbd"/><text x="'+tx+'" y="'+(ty+18.5)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Today · '+fmt(TODAY,false)+'</text>';
  // volume strip
  var vy=AX+lanes.length*LH+GAP, bins=[], weekly=short;
  if(weekly){ var b=new Date(t0.getTime()); b.setDate(b.getDate()-b.getDay()+1); for(;b<t1;b=new Date(b.getTime()+7*DAY)) bins.push([b,new Date(b.getTime()+7*DAY)]); }
  else { var b2=new Date(t0.getFullYear(),t0.getMonth(),1); for(;b2<t1;b2=new Date(b2.getFullYear(),b2.getMonth()+1,1)) bins.push([b2,new Date(b2.getFullYear(),b2.getMonth()+1,1)]); }
  var pool=vis.filter(function(a){return !S.focus||a.client===S.focus;});
  var counts=bins.map(function(bn){ var c={},tot=0; pool.forEach(function(a){ if(a.date>=bn[0]&&a.date<bn[1]){ c[a.type]=(c[a.type]||0)+1; tot++; } }); return {c:c,t:tot,b:bn}; });
  var mx=Math.max(1,Math.max.apply(null,counts.map(function(q){return q.t;})));
  s+='<text x="12" y="'+(vy+14)+'" font-size="11" font-weight="700" fill="#8a94a3" letter-spacing=".06em">'+(weekly?'ENTRIES PER WEEK':'ENTRIES PER MONTH')+'</text>';
  s+='<text x="12" y="'+(vy+30)+'" font-size="11" fill="#8a94a3">'+(S.focus?esc(trunc(S.focus,26)):'all clients')+' · peak '+mx+'</text>';
  s+='<line x1="'+x0+'" x2="'+x1+'" y1="'+(vy+VH)+'" y2="'+(vy+VH)+'" stroke="#d9dde3"/>';
  counts.forEach(function(q){ var a=Math.max(x0,sx(q.b[0])), z=Math.min(x1,sx(q.b[1])); if(z-a<3) return; var bw=Math.max(2,z-a-(weekly?3:6)), bx=a+(z-a-bw)/2, yy=vy+VH;
    var tip=(weekly?'Week of '+fmt(q.b[0]):MON[q.b[0].getMonth()]+' '+q.b[0].getFullYear())+': '+plural(q.t,"entry","entries")+(q.t?' ('+TYPES.filter(function(t){return q.c[t.k];}).map(function(t){return q.c[t.k]+' '+t.k.toLowerCase();}).join(', ')+')':'');
    s+='<g class="vb" data-tip="'+esc(tip)+'">';
    TYPES.forEach(function(t){ var n=q.c[t.k]||0; if(!n) return; var hh=n/mx*(VH-8); yy-=hh; s+='<rect x="'+bx+'" y="'+yy+'" width="'+bw+'" height="'+Math.max(0,hh-1)+'" rx="2" fill="'+t.c+'" opacity=".85"/>'; });
    s+='<rect x="'+bx+'" y="'+vy+'" width="'+bw+'" height="'+VH+'" fill="transparent"/></g>'; });
  s+='</svg><div class="tip" id="tip"></div>';
  host.innerHTML=s; firstDraw=false;
}
function trunc(s,n){ return s.length>n?s.slice(0,n-1)+"…":s; }

/* ---------- side panel ---------- */
function drawSide(){
  var el=document.getElementById("side"); if(!el) return;
  var a=S.sel?byId(S.sel):null, h='';
  if(a){
    var t=TC[a.type]||{c:"#7a8699",s:"circle"}, st=fuState(a), cl=D.clients.filter(function(c){return c.name===a.client;})[0];
    h+='<div class="det"><button class="close" data-act="clear" title="Close">×</button>';
    h+='<span class="pill" style="background:'+t.c+'1f;color:'+t.c+'"><svg width="10" height="10" viewBox="0 0 14 14">'+shape(t.s,7,7,5,t.c,"")+'</svg>'+esc(a.type)+'</span> ';
    if(a.sentiment) h+='<span class="pill '+(a.sentiment==="Concerned"?'bad':a.sentiment==="Positive"?'ok':'')+'">'+esc(a.sentiment)+'</span>';
    h+='<h3>'+esc(a.title)+'</h3><div class="meta"><a href="#" data-focus="'+esc(a.client)+'">'+esc(a.client)+'</a>'+(cl&&cl.health?' · <span class="pill '+hcls(cl.health)+'">'+esc(cl.health)+'</span>':'')+'<br>'+fmt(a.date,true)+(a.owner?' · '+esc(a.owner):'')+'</div>';
    if(a.notes) h+='<div class="notes">'+esc(a.notes)+'</div>';
    if(a.follow==="Open"&&a.step){ var n=days(a.due);
      h+='<div class="fu '+st+'"><div class="l">Follow-up · '+(n===null?'no date':n<0?plural(-n,"day")+' overdue':n===0?'due today':'due '+fmt(a.due)+' ('+plural(n,"day")+')')+'</div><div>'+esc(a.step)+'</div></div>'; }
    else if(a.follow==="Done"&&a.step){ h+='<div class="fu"><div class="l">Follow-up · done</div><div>'+esc(a.step)+'</div></div>'; }
    h+='<div class="row">'; var iu=itemUrl(a.id); if(iu) h+='<a class="btn" href="'+esc(iu)+'" target="_blank" rel="noopener">Open item</a>'; if(a.ticket) h+='<a class="btn" href="'+esc(a.ticket)+'" target="_blank" rel="noopener">Ticket</a>'; h+='</div>';
    var hist=D.acts.filter(function(x){return x.client===a.client&&x.id!==a.id;}).slice().sort(function(p,q){return q.date-p.date;}).slice(0,6);
    if(hist.length){ h+='<div class="sec">More with '+esc(trunc(a.client,22))+'</div><ul class="hist">';
      hist.forEach(function(x){ var tt=TC[x.type]||{c:"#7a8699"}; h+='<li data-id="'+esc(x.id)+'"><span class="hd">'+fmt(x.date,false)+'</span><span class="sw" style="background:'+tt.c+'"></span><span class="ht">'+esc(x.title)+'</span></li>'; });
      h+='</ul>'; }
    h+='</div>';
  } else {
    var A=scoped(), open=A.filter(function(x){return x.follow==="Open"&&x.due;}).sort(function(p,q){return p.due-q.due;});
    var od=open.filter(function(x){return fuState(x)==="od";}), soon=open.filter(function(x){return fuState(x)==="soon";});
    h+='<h2>Needs attention'+(S.focus?' · '+esc(trunc(S.focus,20)):'')+'</h2><p class="hint">Click any marker for the full entry. Click a client name to focus on it.</p>';
    if(!od.length&&!soon.length) h+='<p class="empty">Nothing overdue or due this week.</p>';
    if(od.length){ h+='<div class="sec">Overdue · '+od.length+'</div><ul class="att">'; od.forEach(function(x){ h+='<li class="od" data-id="'+esc(x.id)+'"><div class="t">'+esc(x.step)+'</div><div class="m">'+esc(x.client)+' · <b>'+plural(-days(x.due),"day")+' late</b></div></li>'; }); h+='</ul>'; }
    if(soon.length){ h+='<div class="sec">Due in the next 7 days · '+soon.length+'</div><ul class="att">'; soon.forEach(function(x){ var n=days(x.due); h+='<li class="soon" data-id="'+esc(x.id)+'"><div class="t">'+esc(x.step)+'</div><div class="m">'+esc(x.client)+' · '+(n===0?'today':n===1?'tomorrow':fmt(x.due))+'</div></li>'; }); h+='</ul>'; }
    var recent=A.filter(function(x){return x.type==="Decision";}).slice(-3).reverse();
    if(recent.length){ h+='<div class="sec">Latest decisions</div><ul class="hist">'; recent.forEach(function(x){ h+='<li data-id="'+esc(x.id)+'"><span class="hd">'+fmt(x.date,false)+'</span><span class="sw" style="background:#8a3ffc"></span><span class="ht">'+esc(x.title)+' <span style="color:#8a94a3">· '+esc(x.client)+'</span></span></li>'; }); h+='</ul>'; }
  }
  el.innerHTML=h;
}

/* ---------- interaction ---------- */
function select(id){ S.sel=(S.sel===id?"":id); var a=byId(id); if(a&&S.off[a.type]) S.off[a.type]=false; drawChart(); drawSide(); }
function closest(el,attr){ while(el&&el!==document){ if(el.getAttribute&&el.getAttribute(attr)!=null) return el; el=el.parentNode; } return null; }
document.addEventListener("click",function(e){
  var t=e.target, n;
  if((n=closest(t,"data-act"))){ var act=n.getAttribute("data-act");
    if(act==="refresh"){ try{ window.parent.postMessage({type:"ka-html-viewer-refresh"},"*"); }catch(x){} return; }
    if(act==="clear"){ S.sel=""; drawChart(); drawSide(); return; }
    if(act==="fu"){ S.fu=!!n.checked; drawChart(); return; } }
  if((n=closest(t,"data-type"))){ var k=n.getAttribute("data-type"); S.off[k]=!S.off[k]; render(); return; }
  if((n=closest(t,"data-range"))){ S.range=n.getAttribute("data-range"); render(); return; }
  if((n=closest(t,"data-focus"))){ e.preventDefault(); var f=n.getAttribute("data-focus"); S.focus=(S.focus===f?"":f); render(); return; }
  if((n=closest(t,"data-id"))){ select(n.getAttribute("data-id")); return; }
});
document.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ var n=closest(e.target,"data-id"); if(n){ e.preventDefault(); select(n.getAttribute("data-id")); } } if(e.key==="Escape"&&S.sel){ S.sel=""; drawChart(); drawSide(); } });
function showTip(e){
  var tip=document.getElementById("tip"), chart=document.getElementById("chart"); if(!tip||!chart) return;
  var n=closest(e.target,"data-id"), v=closest(e.target,"data-tip"), h="";
  if(n&&chart.contains(n)){ var a=byId(n.getAttribute("data-id")); if(a){ var st=fuState(a), isFlag=n.getAttribute("aria-label")&&n.getAttribute("aria-label").indexOf("Follow-up:")===0;
      h=isFlag?('<span class="m">Follow-up · '+esc(a.client)+'</span><br><b>'+esc(a.step)+'</b><br><span class="m">'+(days(a.due)<0?plural(-days(a.due),"day")+' overdue':'due '+fmt(a.due,true))+(a.owner?' · '+esc(a.owner):'')+'</span>')
        :('<span class="m">'+fmt(a.date,true)+' · '+esc(a.type)+'</span><br><b>'+esc(a.title)+'</b><br><span class="m">'+esc(a.client)+(a.owner?' · '+esc(a.owner):'')+(a.sentiment?' · '+esc(a.sentiment):'')+'</span>'+(st?'<br><span class="m">Follow-up: '+esc(a.step)+'</span>':'')); } }
  else if(v&&chart.contains(v)){ h=esc(v.getAttribute("data-tip")); }
  if(!h){ tip.className="tip"; return; }
  tip.innerHTML=h; var r=chart.getBoundingClientRect(), x=e.clientX-r.left+14, y=e.clientY-r.top+14;
  tip.className="tip on"; var tw=tip.offsetWidth||260, th=tip.offsetHeight||70;
  if(x+tw>r.width-4) x=e.clientX-r.left-tw-14; if(y+th>r.height-4) y=e.clientY-r.top-th-12;
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
document.addEventListener("mousemove",showTip);
var rt=0; window.addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(drawChart,120); });

function boot(){ D=load(); if(!D.acts.length){ document.getElementById("app").innerHTML='<div class="card side"><h2>No activity yet</h2><p class="empty">Log a call, meeting or decision on the Client Activity list and it will appear here.</p></div>'; return; } render(); }
function liveReady(){ var r=window.__LD_RESULTS__; return !!(r&&KEYS.activity&&r[KEYS.activity]); }
function poll(){ var tries=0, iv=setInterval(function(){ tries++; if(D&&(D.src.activity!=="live"||D.src.clients!=="live")){ var nd=load(); if(nd.src.activity!==D.src.activity||nd.src.clients!==D.src.clients){ D=nd; render(); } } if(tries>40||(D&&D.src.activity==="live"&&D.src.clients==="live")) clearInterval(iv); },500); }
var waited=0;
(function start(){ if(liveReady()||!KEYS.activity||waited>=1800){ boot(); poll(); } else { waited+=150; setTimeout(start,150); } })();
})();
</script>
